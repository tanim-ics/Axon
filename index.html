<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Strict CSP: only this folder's own scripts and styles. No inline code, no network, no forms. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Learn to design, build and tune AI agents by playing. Hands-on, visual, beginner friendly.">
  <title>Axon — learn to build and tune AI agents by playing</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A4%96%3C/text%3E%3C/svg%3E">
  <link rel="preload" href="fonts/ibm-plex-mono-latin-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/inter-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css?v=36">
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>

  <header class="hud">
    <a class="brand" href="#/map" aria-label="Axon — all journeys">
      <span class="brand-name">axon</span>
    </a>
    <div class="hud-stats">
      <span class="rank" id="rank"></span>
      <div class="xp" id="xp" role="img" aria-label="Experience">
        <div class="xpbar"><div class="xpfill" id="xpfill"></div></div>
        <span class="xptext" id="xptext" aria-hidden="true"></span>
      </div>
      <span class="pill" id="streak" role="img"></span>
      <a class="iconbtn" href="#/codex" aria-label="Codex: your cards and badges"><span aria-hidden="true">📖</span></a>
      <a class="iconbtn profile-btn" id="profile" href="#/profile" aria-label="Profile"><span aria-hidden="true" id="profile-initial"></span></a>
      <button class="iconbtn" id="sound" type="button" aria-pressed="true" aria-label="Sound effects"><span aria-hidden="true" id="sound-icon">🔊</span></button>
    </div>
  </header>

  <p class="notice" id="notice" role="status" hidden></p>

  <main id="app" tabindex="-1"></main>

  <noscript><p class="noscript">Axon is an interactive game and needs JavaScript to run.</p></noscript>

  <template id="tpl-bot">
    <svg class="bot" viewBox="0 0 120 120" aria-hidden="true" focusable="false">
      <line class="bot-ant" x1="60" y1="24" x2="60" y2="12"/>
      <circle class="bot-bulb" cx="60" cy="9" r="6"/>
      <rect class="bot-ear" x="8" y="48" width="14" height="24" rx="6"/>
      <rect class="bot-ear" x="98" y="48" width="14" height="24" rx="6"/>
      <rect class="bot-head" x="18" y="24" width="84" height="72" rx="22"/>
      <rect class="bot-face" x="30" y="38" width="60" height="44" rx="14"/>
      <g class="bot-eyes">
        <ellipse class="bot-eye" cx="46" cy="55" rx="6" ry="8"/>
        <ellipse class="bot-eye" cx="74" cy="55" rx="6" ry="8"/>
      </g>
      <path class="bot-mouth m-idle" d="M51 70 Q60 76 69 70"/>
      <path class="bot-mouth m-happy" d="M48 67 Q60 82 72 67 Z"/>
      <path class="bot-mouth m-oops" d="M51 74 Q60 66 69 74"/>
      <rect class="bot-neck" x="40" y="98" width="40" height="14" rx="7"/>
    </svg>
  </template>

  <script src="js/content.js?v=36" defer></script>
  <script src="js/engine.js?v=36" defer></script>
  <script src="js/markdown.js?v=36" defer></script>
  <script src="js/ui.js?v=36" defer></script>
  <script src="js/games/loop.js?v=36" defer></script>
  <script src="js/games/tools.js?v=36" defer></script>
  <script src="js/games/prompt.js?v=36" defer></script>
  <script src="js/games/memory.js?v=36" defer></script>
  <script src="js/games/pipeline.js?v=36" defer></script>
  <script src="js/games/guard.js?v=36" defer></script>
  <script src="js/games/trace.js?v=36" defer></script>
  <script src="js/games/boss.js?v=36" defer></script>
  <script src="js/games/mission.js?v=36" defer></script>
  <script src="js/games/recall.js?v=36" defer></script>
  <script src="js/games/learn.js?v=36" defer></script>
  <script src="js/games/sort.js?v=36" defer></script>
  <script src="js/games/order.js?v=36" defer></script>
  <script src="js/games/sim.js?v=36" defer></script>
  <script src="js/games/fix.js?v=36" defer></script>
  <script src="js/games/blitz.js?v=36" defer></script>
  <script src="js/app.js?v=36" defer></script>
</body>
</html>
